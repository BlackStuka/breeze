name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Configure Maven toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>25</version>
                <vendor>any</vendor>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
      - name: Verify backend
        working-directory: breeze-server
        run: mvn --batch-mode verify

  ui:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: breeze-ui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: breeze-ui
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: breeze-ui
        run: pnpm lint
      - name: Unit tests
        working-directory: breeze-ui
        run: pnpm test
      - name: Production build
        working-directory: breeze-ui
        run: pnpm build
